<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Lịch Hẹn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #4f46e5; /* Solid Purple background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 8px 0;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: #6b7280;
            margin: 0 0 24px 0;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            background-color: #f9fafb;
        }

        .form-group input:focus {
            border-color: #6366f1;
            background-color: white;
        }

        .btn-auth {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn-auth:hover {
            background-color: #4f46e5;
        }

        .toggle-text {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 20px;
        }

        .toggle-link {
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Form -->
        <div id="loginSection" class="form-section active">
            <h1 class="auth-title">Chào mừng trở lại</h1>
            <p class="auth-subtitle">Đăng nhập để quản lý lịch hẹn của bạn</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn-auth">Đăng Nhập</button>
            </form>
            <div class="toggle-text">
                Chưa có tài khoản? <span class="toggle-link" onclick="toggleForms()">Đăng ký ngay</span>
            </div>
        </div>

        <!-- Register Form -->
        <div id="registerSection" class="form-section">
            <h1 class="auth-title">Tạo tài khoản mới</h1>
            <p class="auth-subtitle">Bắt đầu quản lý lịch trình của bạn ngay hôm nay</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Tên của bạn</label>
                    <input type="text" id="regName" placeholder="Nhập họ tên" required>
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="regUsername" placeholder="Nhập tên đăng nhập" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="regPassword" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn-auth">Đăng Ký</button>
            </form>
            <div class="toggle-text">
                Đã có tài khoản? <span class="toggle-link" onclick="toggleForms()">Đăng nhập ngay</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5182/api/auth';

        function toggleForms() {
            document.getElementById('loginSection').classList.toggle('active');
            document.getElementById('registerSection').classList.toggle('active');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('calendarUserId', data.userID);
                    window.location.href = 'index.html';
                } else {
                    const err = await res.text();
                    alert("Đăng nhập thất bại: " + err);
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối.");
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, password })
                });

                if (res.ok) {
                    alert("Đăng ký thành công! Vui lòng đăng nhập.");
                    toggleForms();
                } else {
                    const err = await res.text();
                    alert("Đăng ký thất bại: " + err);
                }
            } catch (err) {
                console.error(err);
                alert("Lỗi kết nối.");
            }
        });
    </script>
</body>
</html>
